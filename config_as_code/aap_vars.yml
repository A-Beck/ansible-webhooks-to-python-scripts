---
# AAP Controller + EDA objects for the webhook → rulebook → job template →
# ServiceNow demo.
# Auth (aap_hostname, aap_username/aap_password or aap_token) is passed at
# apply time via extra vars — do not commit secrets here.

controller_credential_types:
  - name: ServiceNow
    description: ServiceNow instance credentials for incident creation
    kind: cloud
    inputs:
      fields:
        - type: string
          id: sn_base_url
          label: ServiceNow Base URL
        - type: string
          id: sn_username
          label: ServiceNow Username
        - type: string
          id: sn_password
          label: ServiceNow Password
          secret: true
      required:
        - sn_base_url
        - sn_username
        - sn_password
    injectors:
      env:
        # Script path uses SN_BASE_URL; servicenow.itsm uses SN_HOST
        SN_BASE_URL: !unsafe "{{ sn_base_url }}"
        SN_HOST: !unsafe "{{ sn_base_url }}"
        SN_USERNAME: !unsafe "{{ sn_username }}"
        SN_PASSWORD: !unsafe "{{ sn_password }}"

controller_credentials:
  - name: ServiceNow Demo
    description: Demo ServiceNow credential (replace CHANGE_ME values before use)
    organization: Default
    credential_type: ServiceNow
    inputs:
      sn_base_url: "{{ sn_base_url }}"
      sn_username: "{{ sn_username }}"
      sn_password: "{{ sn_password }}"

controller_projects:
  - name: ansible-webhooks-to-python-scripts
    description: Webhook to Python script demo project
    organization: Default
    scm_type: git
    scm_url: https://github.com/A-Beck/ansible-webhooks-to-python-scripts.git
    scm_branch: main
    scm_update_on_launch: true

controller_inventories:
  - name: Demo Localhost
    description: Localhost inventory for running scripts on the controller
    organization: Default

controller_hosts:
  - name: localhost
    inventory: Demo Localhost
    variables:
      ansible_connection: local

controller_templates:
  - name: open_snow_incident
    description: Create a ServiceNow incident via Python script
    organization: Default
    project: ansible-webhooks-to-python-scripts
    playbook: playbooks/run_snow_incident_script.yml
    inventory: Demo Localhost
    credentials:
      - ServiceNow Demo
    ask_credential_on_launch: false
    # Required so EDA can pass event_payload (and ansible_eda) as extra vars
    ask_variables_on_launch: true

  - name: open_snow_incident_itsm
    description: Create a ServiceNow incident via servicenow.itsm.incident
    organization: Default
    project: ansible-webhooks-to-python-scripts
    playbook: playbooks/run_snow_incident_itsm.yml
    inventory: Demo Localhost
    credentials:
      - ServiceNow Demo
    ask_credential_on_launch: false
    ask_variables_on_launch: true

# --- Event-Driven Ansible ---

eda_credentials:
  - name: AAP Controller
    description: Allows EDA to launch Controller job templates (uses setup playbook auth vars)
    organization: Default
    credential_type: Red Hat Ansible Automation Platform
    inputs:
      host: "{{ aap_hostname }}/api/controller"
      username: "{{ aap_username }}"
      password: "{{ aap_password }}"
      verify_ssl: "{{ aap_validate_certs | default(false) | bool }}"

  - name: Disk Usage Event Stream Auth
    description: Basic auth for the disk usage webhook event stream
    organization: Default
    credential_type: Basic Event Stream
    inputs:
      username: redhat
      password: redhat

  - name: CPU Usage Event Stream Auth
    description: Basic auth for the CPU usage webhook event stream
    organization: Default
    credential_type: Basic Event Stream
    inputs:
      username: redhat
      password: redhat

  - name: Combined Usage Event Stream Auth
    description: Basic auth for the combined disk/CPU webhook event stream
    organization: Default
    credential_type: Basic Event Stream
    inputs:
      username: redhat
      password: redhat

eda_projects:
  - name: ansible-webhooks-to-python-scripts
    description: EDA rulebooks for the webhook demo
    organization: Default
    url: https://github.com/A-Beck/ansible-webhooks-to-python-scripts.git
    scm_branch: main
    sync: true

eda_event_streams:
  - name: Disk Usage Event Stream
    organization: Default
    credential_name: Disk Usage Event Stream Auth
    forward_events: true

  - name: CPU Usage Event Stream
    organization: Default
    credential_name: CPU Usage Event Stream Auth
    forward_events: true

  - name: Combined Usage Event Stream
    organization: Default
    credential_name: Combined Usage Event Stream Auth
    forward_events: true

eda_decision_environments:
  - name: Demo Decision Environment
    description: Decision environment for the webhook rulebook demo
    organization: Default
    image_url: quay.io/ansible/ansible-rulebook:latest

eda_rulebook_activations:
  - name: disk_usage_webhook
    description: Disk-only stream → disk rulebook → open_snow_incident
    organization: Default
    project: ansible-webhooks-to-python-scripts
    rulebook: disk_usage_alerts.yml
    decision_environment: Demo Decision Environment
    eda_credentials:
      - AAP Controller
    event_streams:
      - event_stream: Disk Usage Event Stream
        source_name: disk_usage_alerts
    swap_single_source: true
    restart_policy: always
    enabled: true
    state: present

  - name: disk_usage_webhook_itsm
    description: Disk-only stream → disk ITSM rulebook → open_snow_incident_itsm
    organization: Default
    project: ansible-webhooks-to-python-scripts
    rulebook: disk_usage_alerts_itsm.yml
    decision_environment: Demo Decision Environment
    eda_credentials:
      - AAP Controller
    event_streams:
      - event_stream: Disk Usage Event Stream
        source_name: disk_usage_alerts_itsm
    swap_single_source: true
    restart_policy: always
    enabled: true
    state: present

  - name: cpu_usage_webhook
    description: CPU-only stream → CPU rulebook → open_snow_incident
    organization: Default
    project: ansible-webhooks-to-python-scripts
    rulebook: cpu_usage_alerts.yml
    decision_environment: Demo Decision Environment
    eda_credentials:
      - AAP Controller
    event_streams:
      - event_stream: CPU Usage Event Stream
        source_name: cpu_usage_alerts
    swap_single_source: true
    restart_policy: always
    enabled: true
    state: present

  - name: combined_usage_webhook
    description: Combined stream → multi-type rulebook → open_snow_incident
    organization: Default
    project: ansible-webhooks-to-python-scripts
    rulebook: combined_usage_alerts.yml
    decision_environment: Demo Decision Environment
    eda_credentials:
      - AAP Controller
    event_streams:
      - event_stream: Combined Usage Event Stream
        source_name: combined_usage_alerts
    swap_single_source: true
    restart_policy: always
    enabled: true
    state: present
