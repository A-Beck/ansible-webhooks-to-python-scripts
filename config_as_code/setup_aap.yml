---
- name: Configure Ansible Automation Platform
  hosts: localhost
  connection: local
  gather_facts: false
  # Pass aap_hostname, aap_username, aap_password (and optionally
  # aap_validate_certs) via -e / extra vars. Those same values are reused
  # for the EDA "AAP Controller" credential in aap_vars.yml.

  pre_tasks:
    - name: Load AAP configuration variables
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "{{ playbook_dir }}/aap_vars.yml"
        - "{{ playbook_dir }}/aap_secrets.yml"

  tasks:
    - name: Apply AAP configuration via dispatch
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch

    # Dispatch manages organizations before credentials exist. Re-apply orgs
    # afterward so galaxy_credentials on Default can resolve successfully.
    - name: Assign Galaxy credentials to organizations
      ansible.builtin.include_role:
        name: infra.aap_configuration.gateway_organizations
      vars:
        assign_galaxy_credentials_to_org: true
        assign_default_ee_to_org: false
        assign_notification_templates_to_org: false
        assign_instance_groups_to_org: false
      when: aap_organizations is defined
