---
- name: Configure Ansible Automation Platform
  hosts: localhost
  connection: local
  gather_facts: false
  # Pass aap_hostname, aap_username, aap_password (and optionally
  # aap_validate_certs) via -e / extra vars. Those same values are reused
  # for the EDA "AAP Controller" credential in aap_vars.yml.

  pre_tasks:
    - name: Load AAP configuration variables
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "{{ playbook_dir }}/aap_vars.yml"
        - "{{ playbook_dir }}/aap_secrets.yml"

  tasks:
    - name: Apply AAP configuration via dispatch
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch
