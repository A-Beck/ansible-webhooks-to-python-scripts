---
- name: Receive Message Events On Webhook
  hosts: all
  sources:
    - name: disk_usage_alerts
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
        ssl_verify: no

  rules:
    - name: Trigger action when any disk usage exceeds 40%
      condition: event.payload.disks is selectattr('use_percent', 'regex', '^(4[1-9]|[5-9][0-9]|100)%$')
      action:
        run_job_template:
          name: open_snow_incident
          organization: Default
